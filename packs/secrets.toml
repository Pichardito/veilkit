# Veilkit pack: secrets — credentials that must never reach a log or a prompt.
version = "2026.10"

[[rule]]
id = "secret.aws_access_key_id"
severity = "high"
description = "AWS access key id (AKIA/ASIA prefix)"
pattern = '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'

[[rule]]
id = "secret.aws_secret_key"
severity = "high"
description = "Labeled AWS secret access key (40 base64 chars after the label)"
pattern = '(?i)aws(?:_|-| )?secret(?:_|-| )?(?:access(?:_|-| )?)?key[^\n]{0,20}?[A-Za-z0-9/+=]{40}\b'

[[rule]]
id = "secret.github_token"
severity = "high"
description = "GitHub personal, OAuth, app or fine-grained token"
pattern = '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{82})\b'

[[rule]]
id = "secret.slack_token"
severity = "high"
description = "Slack bot, user, app or refresh token"
pattern = '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'

[[rule]]
id = "secret.stripe_key"
severity = "high"
description = "Stripe secret or restricted key (publishable pk_ keys are not matched)"
pattern = '\b(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}\b'

[[rule]]
id = "secret.google_api_key"
severity = "high"
description = "Google API key (AIza prefix)"
pattern = '\bAIza[0-9A-Za-z_-]{35}\b'

[[rule]]
id = "secret.jwt"
severity = "medium"
description = "JSON Web Token (three base64url segments starting with eyJ)"
pattern = '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'

[[rule]]
id = "secret.pem_private_key"
severity = "high"
label = "PRIVATE_KEY"
description = "PEM private key block (RSA, EC, DSA, OpenSSH, PGP or unqualified)"
pattern = '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----[\s\S]*?-----END (?:[A-Z]+ )?PRIVATE KEY-----'

[[rule]]
id = "secret.generic_api_key"
severity = "medium"
label = "API_KEY"
description = "Generic key assignment: api_key / secret_key / access_token = value (16+ chars)"
pattern = '''(?i)\b(?:api[_-]?key|api[_-]?secret|secret[_-]?key|access[_-]?token|auth[_-]?token)\b\s*[:=]\s*["']?[A-Za-z0-9_\-/+=.]{16,}'''
