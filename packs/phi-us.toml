# Veilkit pack: phi-us — US protected health information identifiers and
# patient-portal URLs (portal list from the author's earlier work, see NOTICE).
version = "2026.10"

[[rule]]
id = "phi.mrn"
severity = "high"
description = "Labeled medical record number"
pattern = '(?i)\b(?:mrn|medical record(?: number| no\.?| #)?)[:# ]*[A-Z]?\d{5,12}\b'

[[rule]]
id = "phi.npi"
severity = "high"
description = "US National Provider Identifier, check-digit validated; requires an NPI context word"
pattern = '\b\d{10}\b'
validator = "npi"
context = ["npi", "national provider", "provider id", "provider number"]
require_context = true

[[rule]]
id = "phi.dea"
severity = "high"
description = "US DEA registration number, checksum validated"
pattern = '\b[A-HJ-PR-UX][A-Z9]\d{7}\b'
validator = "dea"

[[rule]]
id = "phi.member_id"
severity = "medium"
description = "Labeled health plan member, subscriber or policy id"
pattern = '(?i)\b(?:member|subscriber|policy|health plan|insurance)(?: id| number| no\.?| #)[:# ]*[A-Z0-9-]{6,20}\b'

[[rule]]
id = "phi.icd10"
severity = "medium"
description = "Labeled ICD-10 diagnosis code"
pattern = '(?i)\b(?:icd-?10|dx|diagnosis(?: code)?)[:# ]*[A-TV-Z]\d{2}(?:\.\d{1,4})?\b'

[[rule]]
id = "phi.portal.epic_mychart"
severity = "medium"
label = "PORTAL_URL"
description = "Epic MyChart portal URL"
pattern = '(?i)https?://[a-z0-9.-]*mychart\.[a-z]+(/[^\s]*)?'

[[rule]]
id = "phi.portal.epic_mychart_patient"
severity = "high"
label = "PORTAL_URL"
description = "Epic MyChart URL carrying a patient identifier in the query"
pattern = '(?i)https?://[a-z0-9.-]*mychart\.[a-z0-9.-]+/[^\s]*[?&](mrn|patientid|csn)=[^\s]*'

[[rule]]
id = "phi.portal.cerner"
